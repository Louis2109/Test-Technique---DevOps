services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-articles_db}
      POSTGRES_USER: ${DB_USER:-article}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-article}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: ${APP_IMAGE:-articles-api:local}
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-articles_db}
      DB_USER: ${DB_USER:-article}
      DB_PASSWORD: ${DB_PASSWORD:-article}
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  pgdata:
